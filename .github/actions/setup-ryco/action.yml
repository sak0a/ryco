name: Setup Ryco
description: Install the Vite+, Bun, and Node toolchains, restore build caches, and optionally install dependencies.

inputs:
  install-dependencies:
    description: Run vp install after toolchain setup.
    required: false
    default: "true"
  registry-url:
    description: Optional npm registry URL for publish jobs.
    required: false
    default: ""
  vite-plus-version:
    description: Vite+ CLI version. Keep aligned with package.json workspaces.catalog.vite-plus.
    required: false
    default: "0.1.24"

runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1
      with:
        version: ${{ inputs['vite-plus-version'] }}
        node-version-file: package.json
        # Runner containers do not share a stable home directory. Their
        # package-manager cache cannot be safely restored across jobs.
        cache: false
        cache-dependency-path: bun.lock
        registry-url: ${{ inputs['registry-url'] }}
        run-install: false

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
        # Let the explicit workspace-local Turbo cache own reuse instead of
        # restoring a package-manager path from a different runner container.
        no-cache: true

    - name: Cache Turbo
      uses: actions/cache@v5
      with:
        path: .turbo
        # Per-commit key so every run writes a fresh cache entry (GitHub never
        # overwrites an existing key — a lockfile-stable key froze the cache at
        # its first run and never re-saved). restore-keys seed each run from the
        # most recent prefix match, so the cache accumulates commit-to-commit.
        key: ${{ runner.os }}-bun-turbo-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-bun-turbo-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}-
          ${{ runner.os }}-bun-turbo-${{ hashFiles('bun.lock') }}-
          ${{ runner.os }}-bun-turbo-

    - name: Install dependencies
      if: ${{ inputs['install-dependencies'] == 'true' }}
      shell: bash
      run: vp install --frozen-lockfile
