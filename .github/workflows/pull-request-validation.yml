name: Pull Request Validation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pull Request
    uses: ./.github/workflows/_validation.yml
    with:
      run-browser-tests: true
      run-desktop-build: true
      run-release-smoke: true
