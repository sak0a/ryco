name: Branch CI

# Manual-only branch validation. Pull request validation is the single
# automatic source of truth for branches, so pushes are not validated here —
# that prevents a commit from being validated twice (once on push, once on the
# PR). Use this to validate an arbitrary ref on demand.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to validate. Defaults to the selected workflow ref.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Branch
    uses: ./.github/workflows/_validation.yml
    with:
      checkout-ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}
      run-browser-tests: false
      run-desktop-build: false
      run-release-smoke: false
