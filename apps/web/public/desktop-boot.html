<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <title>Ryco</title>
    <script>
      (() => {
        const lightBackground = "#ffffff";
        const darkBackground = "#0b0b0c";
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.backgroundColor = isDark ? darkBackground : lightBackground;
      })();
    </script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        align-items: center;
        background: #ffffff;
        color: #262626;
        display: flex;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        justify-content: center;
        overflow: hidden;
      }

      html.dark body {
        background: #0b0b0c;
        color: #f5f5f5;
      }

      #boot-shell {
        display: grid;
        height: 96px;
        place-items: center;
        width: 96px;
      }

      #boot-logo {
        animation: boot-logo-pulse 1.4s ease-in-out infinite;
        height: 64px;
        object-fit: contain;
        width: 64px;
      }

      @keyframes boot-logo-pulse {
        0%,
        100% {
          opacity: 0.74;
          transform: scale(0.985);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="boot-shell" aria-label="Ryco is starting" role="status">
      <!--
        Keep this mark inline. This page is intentionally displayed before the
        app bundle loads, and the former apple-touch-icon image was the legacy
        square wordmark which could be served from an existing cache.
      -->

</html>
