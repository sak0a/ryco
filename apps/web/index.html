<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <meta name="apple-mobile-web-app-title" content="Ryco" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", isDark);
        const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
        document.documentElement.style.backgroundColor = chromeColor;
        themeColorMeta?.setAttribute("content", chromeColor);
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
        animation: boot-logo-pulse 1.4s ease-in-out infinite;
      }

      @keyframes boot-logo-pulse {
        0%,
        100% {
          opacity: 0.74;
          transform: scale(0.985);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-shell-logo {
          animation: none;
        }
      }
    </style>
    <title>Ryco (Alpha)</title>
    <script type="module">
      const appendDeferredHeadLink = (attributes) => {
        const link = document.createElement("link");
        for (const [name, value] of Object.entries(attributes)) {
          link.setAttribute(name, value);
        }
        document.head.append(link);
      };

      window.addEventListener(
        "load",
        () => {
          appendDeferredHeadLink({
            rel: "icon",
            type: "image/png",
            href: "/favicon-96x96.png",
            sizes: "96x96",
          });
          appendDeferredHeadLink({ rel: "shortcut icon", href: "/favicon.ico" });
          appendDeferredHeadLink({
            rel: "apple-touch-icon",
            sizes: "180x180",
            href: "/apple-touch-icon.png",
          });
          appendDeferredHeadLink({ rel: "manifest", href: "/site.webmanifest" });
        },
        { once: true },
      );
      performance.mark("s3:startup:web-entry.import-start");
      void import("/src/main.tsx").finally(() => {
        performance.mark("s3:startup:web-entry.import-end");
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Ryco splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="Ryco" />
        </div>
      </div>
    </div>
  </body>
</html>
