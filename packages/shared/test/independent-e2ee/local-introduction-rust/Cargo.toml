[package]
name = "ryco-independent-local-introduction"
version = "0.0.0"
edition = "2021"
rust-version = "1.68"
publish = false
license = "MIT"

[dependencies]
base64 = "=0.21.7"
base64ct = "=1.6.0"
ed25519-dalek = "=2.1.1"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
ryu = "=1.0.15"
serde_json = "=1.0.143"
sha2 = "=0.10.8"
# Keep the graph readable by the repository's Cargo 1.68 toolchain. Newer
# zeroize releases use edition 2024 before this independent harness can run.
zeroize = "=1.7.0"
